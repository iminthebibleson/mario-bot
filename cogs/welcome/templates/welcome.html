<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">

<link href="./output.css" rel="stylesheet">

<style>
body{
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
</style>
</head>

<body class="bg-transparent">

<div class="w-full h-full flex items-center justify-center">

<!-- M3 Surface Container (Surface Container High / Highest with tonal elevation) -->
<div class="w-[1100px] h-[500px] rounded-[32px]
            relative overflow-hidden
            flex items-center gap-12 px-16
            bg-[#1c1b1f] text-[#e6e1e5]
            border border-[#49454f]/40
            shadow-[0_20px_40px_rgba(0,0,0,0.4)]">

    <!-- M3 Tonal Background Blobs -->
    <div class="absolute inset-0 -z-10 pointer-events-none">
        <div class="absolute w-[450px] h-[450px] bg-[#d0bcff]/15 rounded-full blur-[80px] top-[-100px] left-[-80px]"></div>
        <div class="absolute w-[400px] h-[400px] bg-[#efb8c8]/10 rounded-full blur-[80px] bottom-[-100px] right-[-60px]"></div>
    </div>

    <!-- Avatar with M3 Tertiary/Primary Container Ring -->
    <div class="relative flex-shrink-0">
        <img
            src="{{ avatar }}"
            class="w-48 h-48 rounded-[36px] object-cover ring-4 ring-[#d0bcff]/40 shadow-lg"
        >
    </div>

    <!-- Content with M3 Typography Scale -->
    <div class="flex flex-col justify-center relative z-10">

        <!-- M3 Display Large / Medium -->
        <span class="text-sm font-medium tracking-wider uppercase text-[#d0bcff] mb-2">
            New Member
        </span>

        <h1 class="text-6xl font-extrabold tracking-tight text-[#e6e1e5]">
            Welcome!
        </h1>

        <p class="text-3xl font-semibold mt-3 text-[#f4eff4]">
            {{ username }}
        </p>

        <p class="text-xl mt-2 text-[#cac4d0]">
            You are Member Number <span class="text-[#d0bcff] font-bold">#{{ member_count }}</span>!
        </p>

        <div class="mt-6 pt-4 border-t border-[#49454f]/50 flex items-center gap-3">
            <span class="text-base text-[#4ede80] font-medium tracking-wide">
                ● Enjoy your stay at {{ guild_name }}
            </span>
        </div>

    </div>

</div>

</div>

</body>
</html>

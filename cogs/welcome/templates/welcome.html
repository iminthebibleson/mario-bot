<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">

<link href="./output.css" rel="stylesheet">

<style>
body{
    margin:0;
    width:1200px;
    height:630px;
    overflow:hidden;
}
</style>
</head>

<body class="bg-transparent">

<div class="w-full h-full flex items-center justify-center">

<div class="w-[1100px] h-[500px] rounded-3xl
            relative overflow-hidden
            flex items-center gap-10 px-16
            border border-white/20
            shadow-2xl
            backdrop-blur-2xl
            bg-white/10">

    <!-- LIQUID BLOBS -->
    <div class="absolute inset-0 -z-10">
        <div class="absolute w-[500px] h-[500px] bg-orange-500/40 rounded-full blur-3xl top-[-120px] left-[-100px]"></div>
        <div class="absolute w-[400px] h-[400px] bg-amber-300/30 rounded-full blur-3xl bottom-[-120px] right-[-80px]"></div>
    </div>

    <!-- LIGHT REFLECTION -->
    <div class="absolute inset-0
                bg-gradient-to-br from-white/20 via-transparent to-transparent
                opacity-40 pointer-events-none">
    </div>

    <!-- CONTENT -->
    <img
        src="{{ avatar }}"
        class="w-48 h-48 rounded-full border-8 border-white/40 shadow-xl"
    >

    <div class="text-white relative z-10">

        <h1 class="text-7xl font-bold tracking-tight">
            Welcome!
        </h1>

        <p class="text-4xl mt-4">
            {{ username }}
        </p>

        <p class="text-2xl mt-2 opacity-90">
            Your are Member Number {{ member_count }}!
        </p>

        <p class="text-xl mt-8">
            Enjoy your stay at {{ guild_name }}!
        </p>

    </div>

</div>

</div>

</body>
</html>
